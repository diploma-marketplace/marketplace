# Nginx маркетплейсу. Перевірка: nginx -t, застосувати: nginx -s reload

# HTTP: тільки перевірка Let's Encrypt, усе інше → HTTPS
server {
    listen 80;
    server_name diploma-marketplace.denmarkeast.cloudapp.azure.com;

    # Let's Encrypt перевіряє тут, що сервер наш
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 301 = переїхали назавжди на https://
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: сам сайт
server {
    listen 443 ssl;
    http2 on;
    server_name diploma-marketplace.denmarkeast.cloudapp.azure.com;

    # --- БЕЗПЕКА ТА ЗАГОЛОВКИ ---
    server_tokens off;
    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;

    # Сертифікат Let's Encrypt (отримує certbot)
    ssl_certificate     /etc/letsencrypt/live/diploma-marketplace.denmarkeast.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diploma-marketplace.denmarkeast.cloudapp.azure.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;     # старі протоколи вимкнені
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /usr/share/nginx/html;
    index index.html;

    # Для React: немає такого файлу → index.html, далі React сам покаже сторінку
    location / {
        try_files $uri $uri/ /index.html;
    }

    # TODO (інфраструктура): location /api/ → backend
}
