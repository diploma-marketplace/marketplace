# Nginx маркетплейсу. Перевірка: nginx -t, застосувати: nginx -s reload

# HTTP: тільки перевірка Let's Encrypt, усе інше → HTTPS
server {
    listen 80;
    server_name diploma-marketplace.denmarkeast.cloudapp.azure.com;

    # Let's Encrypt перевіряє тут, що сервер наш
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 301 = переїхали назавжди на https://
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: сам сайт
server {
    listen 443 ssl;
    http2 on;
    server_name diploma-marketplace.denmarkeast.cloudapp.azure.com;

    # Сертифікат Let's Encrypt (отримує certbot)
    ssl_certificate     /etc/letsencrypt/live/diploma-marketplace.denmarkeast.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diploma-marketplace.denmarkeast.cloudapp.azure.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;     # старі протоколи вимкнені
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # TODO (безпека): заголовки HSTS, CSP, X-Frame-Options, X-Content-Type-Options, server_tokens

    root  /usr/share/nginx/html;
    index index.html;

    # Для React: немає такого файлу → index.html, далі React сам покаже сторінку
    location / {
        try_files $uri $uri/ /index.html;
    }

    # TODO (інфраструктура): location /api/ → backend
}
