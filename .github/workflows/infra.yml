# Автоперевірка інфраструктури на кожен PR у main: Docker Compose, Nginx, ролі бази.
# Ті самі перевірки можна запустити локально — скрипти в infra/ci/.
name: infra

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:            # ручний запуск з вкладки Actions

permissions:
  contents: read                # робот лише читає код

concurrency:                    # новий коміт у PR зупиняє стару перевірку
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Синтаксис Docker Compose (сервер і локальна база)
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f dev/docker-compose.yml config --quiet

  nginx:
    name: nginx
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Конфіг Nginx і відповіді сайту
        run: bash infra/ci/test-nginx.sh

  db-roles:
    name: db-roles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Ролі бази на PostgreSQL, налаштованому як Azure
        run: bash infra/ci/test-db-roles.sh
